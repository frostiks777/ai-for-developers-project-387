# Авторевью pull request агентом OpenCode.
#
# Событие `pull_request` с типами opened/synchronize/reopened/ready_for_review —
# агент разбирает каждый PR сам, по критериям из `prompt`.
#
# Права: комментарий в pull request и реакция создаются токеном приложения
# opencode-agent, а не токеном раннера. На токене раннера (`use_github_token: true`)
# экшен видел `permission: none` для `github-actions[bot]` и падал на удалении
# реакции — проверено на run 37064227451 (2026-10-06). Права на запись всё равно
# нужны: агент оставляет замечания, одобрять и мержить не может — таких прав нет.
#
# `id-token: write` обязателен: по нему экшен обменивает OIDC-токен на токен
# приложения.

name: opencode-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Достаточно прочитать diff, коммитить нечего: права только на чтение.
          persist-credentials: false

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/mimo-v2.6-flash-free
          prompt: |
            Проведи ревью этого pull request и оставь замечания комментариями
            от токена раннера. Не меняй код, не коммить, не мержи — только
            замечания. Если замечаний нет, так и напиши и не выдумывай мелочи.

            Что проверять в первую очередь:

            1. **Соответствие задаче.** Прочитай связанный issue (`Closes #N` в
               описании или в коммитах) и описание PR. Совпадает ли фактический
               diff с тем, о чём просил issue? Нет ли лишнего или недостающего.

            2. **Корректность.** Логика, граничные случаи, ошибки в расчётах,
               необработанные ответы API, неверные типы. Отдельно проверь
               асинхронность: не остаются ли гонки и не теряются ли ошибки.

            3. **Тесты.** Есть ли тест, который падал бы до правки и проходит
               после. Соответствует ли тест заявленному эффекту. Не проверяет ли
               тест деталь рендера вместо смысла. Новый ли код покрыт.

            4. **Конвенции репозитория** (читай `AGENTS.md` и `docs/conventions.md`):
               - типы вместо `any`, никаких неиспользуемых импортов;
               - компоненты функциональные, имена `kebab-case` для файлов;
               - никаких комментариев, объясняющих очевидное;
               - сообщения коммитов по Conventional Commits с номером issue.

            5. **Границы.** Не задевается ли что-то за пределы задачи: схема БД,
               контракт API, другие страницы. Для таких решений нужен ADR, а не
               правка в том же PR.

            Формат замечания: что не так, почему это важно, как исправить.
            Коротко. Если замечание по вкусу, а не по существу, не пиши его.

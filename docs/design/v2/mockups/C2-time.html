<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Мастер: выбор времени</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&amp;family=Lora:wght@500;600&amp;display=swap">
<style>
body{margin:0;font-family:"Golos Text",system-ui,sans-serif;color:#1C1917;background:#F4F1EA}
a{color:var(--p)}a:hover{color:var(--p-ink)}
.mk{position:absolute;width:26px;height:26px;border-radius:50%;background:#1C1917;color:#fff;font:700 13px/26px "Golos Text",sans-serif;text-align:center;box-shadow:0 0 0 3px #fff,0 2px 6px rgba(0,0,0,.25);z-index:5}
.ib{width:44px;height:44px;border-radius:50%;border:1px solid #D6CFC2;background:#FFFFFF;display:flex;align-items:center;justify-content:center}

.fx{--ground:#F4F2EC}
.bgfx{position:absolute;inset:0;z-index:-1;overflow:hidden;pointer-events:none;background:var(--ground)}
.bgfx .b{position:absolute;border-radius:50%;filter:blur(64px);opacity:.8;will-change:transform}
.bgfx .b1{width:max(52%,300px);aspect-ratio:1;background:var(--bg1);left:-12%;top:-18%;animation:fxa 19s ease-in-out infinite alternate}
.bgfx .b2{width:max(46%,260px);aspect-ratio:1;background:var(--bg2);right:-10%;top:8%;animation:fxb 23s ease-in-out infinite alternate}
.bgfx .b3{width:max(50%,280px);aspect-ratio:1;background:var(--bg3);left:18%;bottom:-26%;animation:fxc 27s ease-in-out infinite alternate}
.bgfx .b4{width:max(30%,180px);aspect-ratio:1;background:var(--bg4);right:14%;bottom:-8%;opacity:.7;animation:fxd 21s ease-in-out infinite alternate}
.bgfx .grain{position:absolute;inset:0;background-image:radial-gradient(rgba(28,25,23,.05) 1px,transparent 1px);background-size:3px 3px;opacity:.5}
@keyframes fxa{0%{transform:translate(0,0) scale(1)}50%{transform:translate(18%,12%) scale(1.12)}100%{transform:translate(6%,24%) scale(.94)}}
@keyframes fxb{0%{transform:translate(0,0) scale(1)}50%{transform:translate(-16%,18%) scale(.9)}100%{transform:translate(-24%,-6%) scale(1.1)}}
@keyframes fxc{0%{transform:translate(0,0) scale(1)}50%{transform:translate(20%,-14%) scale(1.15)}100%{transform:translate(-10%,-20%) scale(1)}}
@keyframes fxd{0%{transform:translate(0,0) scale(1)}100%{transform:translate(-30%,-40%) scale(1.25)}}
.still .bgfx .b{animation:none}
@media (prefers-reduced-motion: reduce){.bgfx .b{animation:none}}
</style>
</head>
<body>
<div class="fx" style="width: 390px; height: 844px; position: relative; background: var(--ground); isolation: isolate; overflow: hidden; display: flex; flex-direction: column; --p:#0F766E; --p-ink:#0B4F49; --p-soft:#D7F0E8; --p-tint:#F0FAF6; --p-line:#93CFC1; --hot:#FFC53D; --on-hot:#2B1D00; --hot-glow:rgba(255,184,0,.42); --hot2:#FFE08A; --ground:#F4F2EC; --bg1:#A8E6D2; --bg2:#FFC9B8; --bg3:#C9DBFF; --bg4:#FFEAA6">
  <div class="bgfx" aria-hidden="true"><span class="b b1"></span><span class="b b2"></span><span class="b b3"></span><span class="b b4"></span><span class="grain"></span></div>
  <div style="height: 56px; flex-shrink: 0; box-sizing: border-box; padding: 0 8px; background: rgba(255,255,255,.5); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid rgba(255,255,255,.75); display: flex; align-items: center; gap: 4px">
    <a href="#" style="display: flex; align-items: center; gap: 4px; height: 44px; padding: 0 8px; text-decoration: none; font-size: 15px; font-weight: 600; color: #1C1917"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1C1917" stroke-width="2"><path d="M15 6l-6 6 6 6"></path></svg>Дни</a>
    <span style="flex-grow: 1; text-align: center; font-size: 14px; color: #57534E; margin-right: 56px">Звонок-консультация · 30 мин</span>
  </div>
  <div style="padding: 14px 16px 0; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; color: #57534E"><span>ШАГ 2 ИЗ 3 · ВРЕМЯ</span><span>контакты</span></div>
      <div style="height: 4px; border-radius: 4px; background: #E3DDD2"><div style="width: 66%; height: 4px; border-radius: 4px; background: linear-gradient(90deg, var(--p), var(--hot))"></div></div>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between">
      <button type="button" class="ib" aria-label="Предыдущий день"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A29A92" stroke-width="2"><path d="M15 6l-6 6 6 6"></path></svg></button>
      <div style="display: flex; flex-direction: column; align-items: center"><span style="font-size: 18px; font-weight: 700">Пн, 28 сентября</span><span style="font-size: 12px; color: #57534E">10 свободных окон · по Москве</span></div>
      <button type="button" class="ib" aria-label="Следующий день"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1C1917" stroke-width="2"><path d="M9 6l6 6-6 6"></path></svg></button>
    </div>
    <span style="font-size: 12px; font-weight: 700; letter-spacing: .06em; color: #57534E">ДНЁМ</span>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: -6px">
      
        
        
        <div style="height: 52px; box-sizing: border-box; border-radius: 14px; border: 1px dashed #D6CFC2; background: repeating-linear-gradient(135deg, #F4F1EA 0 6px, #FBF9F5 6px 12px); color: #A29A92; font-size: 13px; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.15"><span style="text-decoration: line-through">13:00</span><span style="font-size: 11px">занято</span></div>
      
        <div style="height: 52px; box-sizing: border-box; border-radius: 14px; border: 1px solid var(--p); background: #FFFFFF; color: var(--p); font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center">13:40</div>
        
        
      
        
        <div style="height: 52px; box-sizing: border-box; border-radius: 14px; background: var(--hot); color: var(--on-hot); font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 6px; box-shadow: 0 0 0 4px var(--hot-glow), 0 8px 20px var(--hot-glow)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M5 12l5 5L20 7"></path></svg>14:20</div>
        
      
        <div style="height: 52px; box-sizing: border-box; border-radius: 14px; border: 1px solid var(--p); background: #FFFFFF; color: var(--p); font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center">15:00</div>
        
        
      
        
        
        <div style="height: 52px; box-sizing: border-box; border-radius: 14px; border: 1px dashed #D6CFC2; background: repeating-linear-gradient(135deg, #F4F1EA 0 6px, #FBF9F5 6px 12px); color: #A29A92; font-size: 13px; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.15"><span style="text-decoration: line-through">15:40</span><span style="font-size: 11px">занято</span></div>
      
    </div>
    <span style="font-size: 12px; font-weight: 700; letter-spacing: .06em; color: #57534E">ВЕЧЕРОМ</span>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: -6px">
      
        <div style="height: 52px; box-sizing: border-box; border-radius: 14px; border: 1px solid var(--p); background: #FFFFFF; color: var(--p); font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center">16:20</div>
      
        <div style="height: 52px; box-sizing: border-box; border-radius: 14px; border: 1px solid var(--p); background: #FFFFFF; color: var(--p); font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center">17:00</div>
      
        <div style="height: 52px; box-sizing: border-box; border-radius: 14px; border: 1px solid var(--p); background: #FFFFFF; color: var(--p); font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center">17:40</div>
      
        <div style="height: 52px; box-sizing: border-box; border-radius: 14px; border: 1px solid var(--p); background: #FFFFFF; color: var(--p); font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center">18:20</div>
      
        <div style="height: 52px; box-sizing: border-box; border-radius: 14px; border: 1px solid var(--p); background: #FFFFFF; color: var(--p); font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center">19:00</div>
      
        <div style="height: 52px; box-sizing: border-box; border-radius: 14px; border: 1px solid var(--p); background: #FFFFFF; color: var(--p); font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center">19:40</div>
      
        <div style="height: 52px; box-sizing: border-box; border-radius: 14px; border: 1px solid var(--p); background: #FFFFFF; color: var(--p); font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center">20:20</div>
      
    </div>
  </div>
  <div style="flex-grow: 1"></div>
  <div style="flex-shrink: 0; background: #FFFFFF; border-top: 1px solid #E3DDD2; border-radius: 24px 24px 0 0; box-shadow: 0 -8px 24px rgba(28,25,23,.06); padding: 14px 16px 24px; display: flex; align-items: center; gap: 12px">
    <div style="flex-grow: 1; display: flex; flex-direction: column"><span style="font-size: 12px; color: #57534E">Пн, 28 сентября</span><span style="font-size: 18px; font-weight: 700">14:20 – 14:50</span></div>
    <button type="button" style="height: 56px; padding: 0 28px; border: 0; border-radius: 14px; background: var(--hot); color: var(--on-hot); box-shadow: 0 10px 26px var(--hot-glow); font: 600 17px 'Golos Text', sans-serif">Далее</button>
  </div>
  <span class="mk" style="left: 10px; top: 150px">1</span>
  <span class="mk" style="left: 250px; top: 238px">2</span>
  <span class="mk" style="left: 356px; top: 752px">3</span>
</div>
</body>
</html>

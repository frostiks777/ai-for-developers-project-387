<html lang="ru">
<head>

<style>

<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #111214; color: #F2F3F5; display: flex; flex-direction: column; overflow: hidden; position: relative;">

<div style="padding: 4px 20px 0; display: flex; flex-direction: column; gap: 12px;">
<div style="display: flex; align-items: center; gap: 12px;"><div style="width: 44px; height: 44px; border-radius: 50%; background: #173A35; color: #8FE6D6; font-weight: 700; display: flex; align-items: center; justify-content: center;">ОР</div><span style="font-size: 14px; color: #A3A8B3;">[Имя организатора]</span></div>
<h1 style="margin: 0; font-family: Lora, serif; font-size: 28px; line-height: 1.15; font-weight: 600;">Звонок-консультация</h1>
<div style="display: flex; gap: 8px; flex-wrap: wrap;">
<span style="height: 32px; padding: 0 12px; border-radius: 999px; background: #1B1D21; border: 1px solid #30343B; font-size: 13px; display: flex; align-items: center; gap: 6px; color: #D5D8DE;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#A3A8B3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>30 мин</span>
<span style="height: 32px; padding: 0 12px; border-radius: 999px; background: #1B1D21; border: 1px solid #30343B; font-size: 13px; display: flex; align-items: center; gap: 6px; color: #D5D8DE;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#A3A8B3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="13" height="12" rx="2"></rect><path d="M16 10l5-3v10l-5-3"></path></svg>Онлайн</span>
<label for="timezone" style="height: 32px; padding: 0 10px; border-radius: 999px; background: #1B1D21; border: 1px solid #30343B; font-size: 13px; display: flex; align-items: center; gap: 4px;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#A3A8B3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"></path></svg><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Часовой пояс</span><select id="timezone" style="border: none; background: transparent; color: #F2F3F5; font-size: 13px; outline: none;"><option>GMT+3, Москва</option></select></label>
</div>
</div>
<div style="padding: 20px 0 0 20px; display: flex; flex-direction: column; gap: 10px;">
<div style="display: flex; justify-content: space-between; padding-right: 20px; align-items: center;"><span style="font-size: 15px; font-weight: 600;">Сентябрь 2026</span><button aria-expanded="false" style="border: none; background: transparent; color: #5FD4C0; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 4px; height: 44px;">Весь месяц<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button></div>
<div style="display: flex; gap: 8px; overflow: hidden;"><button aria-label="2026-09-24" aria-pressed="true" style="width: 64px; height: 72px; flex-shrink: 0; border-radius: 16px; background: #5FD4C0; color: #06201C; border: 1px solid #5FD4C0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;"><span style="font-size: 12px; font-weight: 600;">Чт</span><span style="font-size: 22px; font-weight: 700;">24</span></button><button aria-label="2026-09-25" aria-pressed="false" style="width: 64px; height: 72px; flex-shrink: 0; border-radius: 16px; background: #1B1D21; color: #F2F3F5; border: 1px solid #30343B; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;"><span style="font-size: 12px; font-weight: 600;">Пт</span><span style="font-size: 22px; font-weight: 700;">25</span></button><button aria-label="2026-09-28" aria-pressed="false" style="width: 64px; height: 72px; flex-shrink: 0; border-radius: 16px; background: #1B1D21; color: #F2F3F5; border: 1px solid #30343B; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;"><span style="font-size: 12px; font-weight: 600;">Пн</span><span style="font-size: 22px; font-weight: 700;">28</span></button><button aria-label="2026-09-29" aria-pressed="false" style="width: 64px; height: 72px; flex-shrink: 0; border-radius: 16px; background: #1B1D21; color: #F2F3F5; border: 1px solid #30343B; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;"><span style="font-size: 12px; font-weight: 600;">Вт</span><span style="font-size: 22px; font-weight: 700;">29</span></button><button aria-label="2026-09-30" aria-pressed="false" style="width: 64px; height: 72px; flex-shrink: 0; border-radius: 16px; background: #1B1D21; color: #F2F3F5; border: 1px solid #30343B; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;"><span style="font-size: 12px; font-weight: 600;">Ср</span><span style="font-size: 22px; font-weight: 700;">30</span></button></div>
</div>
<div style="padding: 20px 20px 0; display: flex; flex-direction: column; gap: 12px;">
<div style="font-size: 15px; font-weight: 600;">Четверг, 24 сентября <span style="font-weight: 400; color: #A3A8B3;">· 10 окон</span></div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;"><button aria-pressed="false" style="height: 50px; border-radius: 14px; border: 1px solid #30343B; background: #1B1D21; color: #F2F3F5; font-size: 16px; font-weight: 600;">13:00</button><button aria-pressed="false" style="height: 50px; border-radius: 14px; border: 1px solid #30343B; background: #1B1D21; color: #F2F3F5; font-size: 16px; font-weight: 600;">13:40</button><button aria-pressed="true" style="height: 50px; border-radius: 14px; border: 1px solid #5FD4C0; background: #5FD4C0; color: #06201C; font-size: 16px; font-weight: 700;">14:20</button><button disabled="disabled" aria-label="15:00, занято" style="height: 50px; border-radius: 14px; border: 1px dashed #30343B; background: transparent; color: #6B707A; font-size: 15px; text-decoration: line-through;">15:00</button><button aria-pressed="false" style="height: 50px; border-radius: 14px; border: 1px solid #30343B; background: #1B1D21; color: #F2F3F5; font-size: 16px; font-weight: 600;">15:40</button><button aria-pressed="false" style="height: 50px; border-radius: 14px; border: 1px solid #30343B; background: #1B1D21; color: #F2F3F5; font-size: 16px; font-weight: 600;">16:20</button><button disabled="disabled" aria-label="17:00, занято" style="height: 50px; border-radius: 14px; border: 1px dashed #30343B; background: transparent; color: #6B707A; font-size: 15px; text-decoration: line-through;">17:00</button><button aria-pressed="false" style="height: 50px; border-radius: 14px; border: 1px solid #30343B; background: #1B1D21; color: #F2F3F5; font-size: 16px; font-weight: 600;">17:40</button><button aria-pressed="false" style="height: 50px; border-radius: 14px; border: 1px solid #30343B; background: #1B1D21; color: #F2F3F5; font-size: 16px; font-weight: 600;">18:20</button><button aria-pressed="false" style="height: 50px; border-radius: 14px; border: 1px solid #30343B; background: #1B1D21; color: #F2F3F5; font-size: 16px; font-weight: 600;">19:00</button><button aria-pressed="false" style="height: 50px; border-radius: 14px; border: 1px solid #30343B; background: #1B1D21; color: #F2F3F5; font-size: 16px; font-weight: 600;">19:40</button><button aria-pressed="false" style="height: 50px; border-radius: 14px; border: 1px solid #30343B; background: #1B1D21; color: #F2F3F5; font-size: 16px; font-weight: 600;">20:20</button></div>
</div>
<div style="margin-top: auto; padding: 14px 20px 26px; background: #1B1D21; border-top: 1px solid #30343B; display: flex; align-items: center; gap: 12px;">
<div style="flex-grow: 1;"><div style="font-size: 12px; color: #A3A8B3;">Чт, 24 сентября</div><div style="font-size: 17px; font-weight: 700;">14:20 – 14:50</div></div>
<button style="height: 52px; padding: 0 22px; border-radius: 14px; border: none; background: #5FD4C0; color: #06201C; font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px;">Забронировать</button>
</div>
</div>

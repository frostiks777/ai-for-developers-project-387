<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#0F766E" />
    <title>Календарь звонков</title>
    <meta
      name="description"
      content="Онлайн-запись на звонок с организатором: выберите свободное время в календаре, оставьте имя и email — встреча подтвердится сразу, ссылка на напоминание придёт на почту."
    />
    <script>
      try {
        var t = localStorage.getItem('call-calendar-theme')
        var dark =
          t === 'dark' ||
          ((!t || t === 'system') && matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Фавикон «Календарь звонков»: тот же знак, что в логотипе шапки
       (градиент primary → highlight, белый календарь lucide), ADR-0023. -->
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0F766E" />
      <stop offset="1" stop-color="#FFC53D" />
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#brand)" />
  <g
    transform="scale(1.3333)"
    fill="none"
    stroke="#ffffff"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <rect x="3" y="4" width="18" height="18" rx="2" />
    <path d="M16 2v4M8 2v4" />
    <path d="M3 10h18" />
  </g>
</svg>
